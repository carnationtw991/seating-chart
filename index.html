<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室座位表</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Babel 轉換器 (讓瀏覽器能看懂 React JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 防止行動裝置上拖曳時觸發瀏覽器預設的重整或滑動 */
        body { overscroll-behavior-y: none; }
        
        /* 隱藏捲軸但保留滾動功能 (給橫向工具列使用) */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-orange-50 h-screen overflow-hidden">

    <!-- React 應用的掛載點 -->
    <div id="root"></div>

    <!-- 主程式碼 -->
    <script type="text/babel" data-type="module">
        // 從 CDN 引入 React 與 ReactDOM
        import React, { useState, useRef, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        // 從 CDN 引入 Lucide 圖示庫
        import { Users, Plus, LayoutGrid, LayoutTemplate, Box, Magnet, Columns, Smile, Shuffle, GraduationCap, Ban, Settings, X, Check, RotateCcw, FileText, Eye, EyeOff, Undo2, Redo2, Carrot, Wand2, ShieldAlert, User, Lock, Unlock, SlidersHorizontal, Trash2, Image as ImageIcon, Download, ChevronUp, ChevronDown } from 'https://esm.sh/lucide-react@0.292.0';

        //        // === 工具列群組 UI 元件 ===
        const ToolbarGroup = ({ title, children, colorClass, titleColor }) => (
          <div className={`flex flex-col gap-2 p-3 rounded-2xl border shadow-sm relative overflow-hidden group/tb shrink-0 ${colorClass}`}>
              {/* 加入微光高亮點綴質感 */}
              <div className="absolute top-0 right-0 w-24 h-24 bg-white/40 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none transition-transform duration-700 group-hover/tb:scale-150"></div>
              <span className={`text-[11px] font-black tracking-wider px-1 ${titleColor} flex items-center z-10 drop-shadow-sm`}>{title}</span>
              <div className="flex flex-wrap items-center gap-1.5 relative z-10">
                  {children}
              </div>
          </div>
        );

        // === 提取 ToolButton 為獨立元件 ===
        const ToolButton = ({ type, label, subLabel, colorClass, count, description, activeTool, onClick }) => (
          <button
            onClick={() => onClick(type)}
            className={`relative flex flex-col items-start p-3 rounded-xl transition-all duration-200 border-2 w-full text-left group
              ${activeTool === type ? `${colorClass} ring-2 ring-offset-2 ring-blue-100 scale-[1.02] shadow-md` : 'bg-white border-slate-100 hover:bg-slate-50 text-slate-500'}
            `}
          >
            <div className="flex justify-between w-full items-center mb-1">
                <span className={`text-lg font-black ${activeTool === type ? 'text-white' : 'text-slate-700'}`}>
                  {type} 咖 <span className="text-xs font-normal opacity-80">({subLabel})</span>
                </span>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${activeTool === type ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-400'}`}>
                  {count}人
                </span>
            </div>
            <p className={`text-[10px] leading-tight ${activeTool === type ? 'text-white/90' : 'text-slate-400'}`}>
              {description}
            </p>
            {activeTool === type && (
              <div className="absolute -top-2 -right-2 bg-white text-blue-600 rounded-full p-0.5 shadow-sm border border-blue-100">
                  <Check size={12} strokeWidth={4} />
              </div>
            )}
          </button>
        );

        //        // === 名單匯入 Modal ===
        const NameListModal = ({ isOpen, onClose, onApply, initialNameList }) => {
          const [text, setText] = useState("");
          useEffect(() => { if (isOpen) setText(initialNameList.join('\n')); }, [isOpen, initialNameList]);
          if (!isOpen) return null;

          const handleApply = () => {
            const names = text.split(/[\n,，、\s]+/).map(n => n.trim()).filter(n => n !== "");
            onApply(names);
          };
          const handleClear = () => {
            setText("");
            onApply([]);
          };

          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border-4 border-blue-100 animate-in fade-in zoom-in duration-200">
                <div className="bg-blue-50 p-4 border-b border-blue-100 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <FileText className="text-blue-500" />
                        <h2 className="text-xl font-bold text-slate-700">匯入學生名單</h2>
                    </div>
                    <button onClick={onClose} className="p-2 hover:bg-white rounded-full text-slate-400 hover:text-slate-600 transition-colors">
                        <X size={24} />
                    </button>
                </div>
                <div className="p-6">
                    <p className="text-sm text-slate-500 mb-3 font-medium">
                        請貼上學生姓名（支援換行、空格或逗號分隔）。<br/>
                        套用後將<span className="text-blue-600 font-bold">自動依照名單人數修改應到人數</span>並產生座位。
                    </p>
                    <textarea
                        className="w-full h-48 border-2 border-slate-200 rounded-xl p-3 focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none resize-none text-slate-700 font-medium"
                        value={text}
                        onChange={e => setText(e.target.value)}
                        placeholder="例如：&#10;王小明&#10;李小華&#10;張大山"
                    />
                </div>
                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-3 items-center">
                    <button onClick={handleClear} className="px-4 py-2 text-sm font-bold text-slate-500 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
                        清除並改用座號
                    </button>
                    <button onClick={handleApply} className="px-6 py-2 bg-blue-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition-all active:scale-95">
                        套用名單
                    </button>
                </div>
              </div>
            </div>
          );
        };

        // === 排座位條件設定 Modal ===
        const ConditionSettingModal = ({ isOpen, onClose, conditions, setConditions, students, onToggleLock }) => {
          const [tempConditions, setTempConditions] = useState(conditions);
          const [newResA, setNewResA] = useState('');
          const [newResB, setNewResB] = useState('');
          const [lockSelect, setLockSelect] = useState('');

          useEffect(() => { if (isOpen) setTempConditions(conditions); }, [isOpen, conditions]);
          if (!isOpen) return null;

          const handleSave = () => {
              setConditions(tempConditions);
              onClose();
          };

          const addRestriction = () => {
              if (!newResA || !newResB || newResA === newResB) return;
              const exists = tempConditions.restrictions.some(r => 
                  (r.a === newResA && r.b === newResB) || (r.a === newResB && r.b === newResA)
              );
              if (!exists) {
                  setTempConditions({
                      ...tempConditions,
                      restrictions: [...tempConditions.restrictions, { a: newResA, b: newResB }]
                  });
              }
              setNewResA('');
              setNewResB('');
          };

          const removeRestriction = (index) => {
              const newRest = [...tempConditions.restrictions];
              newRest.splice(index, 1);
              setTempConditions({ ...tempConditions, restrictions: newRest });
          };

          const handleLockSubmit = () => {
              if (!lockSelect) return;
              const student = students.find(s => s.label === lockSelect);
              if (student && !student.isLocked) onToggleLock(student.id);
              setLockSelect('');
          };

          const naturalSort = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
          const availableStudents = students.filter(s => s.label && String(s.label).trim() !== "").map(s => String(s.label)).sort(naturalSort);
          const availableForLock = students.filter(s => s.label && String(s.label).trim() !== "" && !s.isLocked).map(s => String(s.label)).sort(naturalSort);
          const lockedStudents = students.filter(s => s.isLocked && s.label && String(s.label).trim() !== "");

          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden border-4 border-indigo-100 animate-in fade-in zoom-in duration-200">
                <div className="bg-indigo-50 p-4 border-b border-indigo-100 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <SlidersHorizontal className="text-indigo-600" />
                        <h2 className="text-xl font-bold text-slate-700">排座位條件設定</h2>
                    </div>
                    <button onClick={onClose} className="p-2 hover:bg-white rounded-full text-slate-400 hover:text-slate-600 transition-colors"><X size={24} /></button>
                </div>
                <div className="p-5 space-y-4 max-h-[65vh] overflow-y-auto bg-slate-50/50">
                    {/* 👫 性別條件 */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <h3 className="text-sm font-black text-blue-600 flex items-center gap-1.5 border-b border-slate-100 pb-2"><User size={16}/> 👫 性別條件</h3>
                        <label className="flex items-center gap-3 cursor-pointer group">
                            <input type="checkbox" className="w-5 h-5 accent-blue-600 rounded cursor-pointer" checked={tempConditions.avoidMixedAdjacent} onChange={(e) => setTempConditions({...tempConditions, avoidMixedAdjacent: e.target.checked})}/>
                            <div className="flex flex-col"><span className="font-bold text-slate-700 text-sm">男女盡量不要相鄰</span><span className="text-[10px] text-slate-400">系統將盡量避免前後左右、斜角相鄰</span></div>
                        </label>
                        <label className="flex items-center gap-3 cursor-pointer group">
                            <input type="checkbox" className="w-5 h-5 accent-blue-600 rounded cursor-pointer" checked={tempConditions.pairMixedTogether} onChange={(e) => setTempConditions({...tempConditions, pairMixedTogether: e.target.checked})}/>
                            <div className="flex flex-col"><span className="font-bold text-slate-700 text-sm">雙排座位：不同性別盡量坐一起</span><span className="text-[10px] text-slate-400">僅在「雙人」模式生效，優先權高於不相鄰</span></div>
                        </label>
                    </div>
                    {/* 🚫 特殊限制 */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-rose-200 space-y-4">
                        <h3 className="text-sm font-black text-rose-500 flex items-center gap-1.5 border-b border-rose-50 pb-2"><ShieldAlert size={16}/> 🚫 特殊限制 (絕對不能相鄰)</h3>
                        <div className="flex items-center gap-2 bg-rose-50/50 p-2 rounded-xl border border-rose-100">
                            <select value={newResA} onChange={e => setNewResA(e.target.value)} className="flex-1 p-2 rounded-lg border-rose-200 text-sm font-bold outline-none"><option value="">選擇學生...</option>{availableStudents.map(name => <option key={name} value={name}>{name}</option>)}</select>
                            <span className="text-rose-400 font-bold text-xs">與</span>
                            <select value={newResB} onChange={e => setNewResB(e.target.value)} className="flex-1 p-2 rounded-lg border-rose-200 text-sm font-bold outline-none"><option value="">選擇學生...</option>{availableStudents.map(name => <option key={name} value={name}>{name}</option>)}</select>
                            <button onClick={addRestriction} disabled={!newResA || !newResB || newResA === newResB} className="px-3 py-2 bg-rose-500 text-white rounded-lg font-bold disabled:opacity-50 whitespace-nowrap">新增限制</button>
                        </div>
                        <div className="space-y-2">
                            {tempConditions.restrictions.map((res, idx) => (
                                <div key={idx} className="flex justify-between items-center p-2 bg-rose-50/30 border border-rose-100 rounded-lg">
                                    <div className="flex items-center gap-3 w-full justify-center">
                                        <span className="font-bold text-slate-700 bg-white shadow-sm px-3 py-1 rounded-md min-w-[4rem] text-center">{res.a}</span>
                                        <span className="text-rose-500 font-black text-xs bg-rose-100 px-2 py-0.5 rounded-full">🚫 不能相鄰</span>
                                        <span className="font-bold text-slate-700 bg-white shadow-sm px-3 py-1 rounded-md min-w-[4rem] text-center">{res.b}</span>
                                    </div>
                                    <button onClick={() => removeRestriction(idx)} className="text-slate-400 hover:text-red-500 p-1 shrink-0"><Trash2 size={16} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                    {/* 📌 固定座位 */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-amber-200 space-y-4">
                        <h3 className="text-sm font-black text-amber-600 flex items-center gap-1.5 border-b border-amber-50 pb-2"><Lock size={16}/> 📌 固定座位</h3>
                        <div className="flex items-center gap-2 bg-amber-50/50 p-2 rounded-xl border border-amber-100">
                            <select value={lockSelect} onChange={e => setLockSelect(e.target.value)} className="flex-1 p-2 rounded-lg border-amber-200 text-sm font-bold outline-none"><option value="">選擇要固定的學生...</option>{availableForLock.map(name => <option key={name} value={name}>{name}</option>)}</select>
                            <button onClick={handleLockSubmit} disabled={!lockSelect} className="px-3 py-2 bg-amber-500 text-white rounded-lg font-bold disabled:opacity-50 whitespace-nowrap">＋ 固定位置</button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {lockedStudents.map(student => (
                                <div key={student.id} className="flex items-center gap-1 bg-amber-100 text-amber-800 px-2 py-1 rounded-lg border border-amber-200 shadow-sm">
                                    <span className="font-bold text-sm px-1">{student.label}</span>
                                    <button onClick={() => onToggleLock(student.id)} className="text-amber-500 hover:text-amber-700 bg-amber-200/50 rounded-full p-0.5"><X size={14} strokeWidth={3} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
                <div className="bg-indigo-50 p-4 border-t border-indigo-100 flex justify-end">
                    <button onClick={handleSave} className="px-8 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all">儲存條件</button>
                </div>
              </div>
            </div>
          );
        };

        // === 能力設定儀表板 Modal ===
        const AbilitySettingModal = ({ isOpen, onClose, students, setStudents }) => {
          const [activeTool, setActiveTool] = useState('A'); 
          if (!isOpen) return null;

          const counts = {
            A: students.filter(s => s.ability === 'A').length, 
            B: students.filter(s => s.ability === 'B').length,
            C: students.filter(s => s.ability === 'C').length, 
            D: students.filter(s => s.ability === 'D').length,
          };

          const handleStudentClick = (id) => {
            const targetStudent = students.find(s => s.id === id);
            if (!targetStudent || targetStudent.isEmpty) return;
            const newStudents = students.map(s => {
              if (s.id === id) return { ...s, ability: s.ability === activeTool ? null : activeTool };
              return s;
            });
            setStudents(newStudents);
          };

          const handleClearAll = () => setStudents(students.map(s => ({ ...s, ability: null })));

          return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden border-4 border-orange-100">
                <div className="bg-orange-50 p-4 border-b border-orange-100 flex justify-between items-center shrink-0">
                    <div className="flex items-center gap-2"><Settings className="text-orange-500" /><h2 className="text-xl font-bold text-slate-700">設定學生程度與角色</h2></div>
                    <button onClick={onClose} className="p-2 hover:bg-white rounded-full text-slate-400 hover:text-slate-600 transition-colors"><X size={24} /></button>
                </div>
                <div className="flex flex-col md:flex-row flex-1 overflow-hidden">
                    <div className="w-full md:w-80 bg-slate-50 p-4 border-r border-slate-100 flex flex-col gap-3 shrink-0 overflow-y-auto">
                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">1. 選擇程度畫筆</div>
                        <ToolButton type="A" activeTool={activeTool} onClick={setActiveTool} subLabel="教練" label="A 咖" colorClass="bg-rose-500 border-rose-600" count={counts.A} description="學科能力最強、學習態度主動" />
                        <ToolButton type="B" activeTool={activeTool} onClick={setActiveTool} subLabel="隊長" label="B 咖" colorClass="bg-blue-500 border-blue-600" count={counts.B} description="中等程度，能夠獨立完成任務" />
                        <ToolButton type="C" activeTool={activeTool} onClick={setActiveTool} subLabel="隊員" label="C 咖" colorClass="bg-emerald-500 border-emerald-600" count={counts.C} description="基礎較弱，但在協助下可完成" />
                        <ToolButton type="D" activeTool={activeTool} onClick={setActiveTool} subLabel="黑馬" label="D 咖" colorClass="bg-amber-500 border-amber-600" count={counts.D} description="需要密集輔導，具進步潛力" />
                        <hr className="border-slate-200 my-2"/>
                        <button onClick={handleClearAll} className="flex items-center justify-center gap-2 w-full py-2.5 bg-white border-2 border-slate-200 text-slate-500 rounded-xl text-sm font-bold hover:bg-red-50 hover:text-red-500 transition-colors"><RotateCcw size={14} /> 全部重置</button>
                    </div>
                    <div className="flex-1 p-6 overflow-y-auto bg-white">
                        <div className="flex justify-between items-center mb-4 sticky top-0 bg-white/95 backdrop-blur z-10 py-2 border-b border-slate-100">
                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">2. 點擊號碼以套用</div>
                        </div>
                        <div className="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-3 pb-10">
                            {students.map((student) => {
                                if (student.isEmpty) return null; 
                                let colorClass = "bg-slate-50 border-slate-200 text-slate-900";
                                if (student.ability === 'A') colorClass = "bg-rose-100 border-rose-500 text-rose-700 shadow-[0_2px_0_0_rgba(244,63,94,1)] translate-y-[-2px]";
                                if (student.ability === 'B') colorClass = "bg-blue-100 border-blue-500 text-blue-700 shadow-[0_2px_0_0_rgba(59,130,246,1)] translate-y-[-2px]";
                                if (student.ability === 'C') colorClass = "bg-emerald-100 border-emerald-500 text-emerald-700 shadow-[0_2px_0_0_rgba(16,185,129,1)] translate-y-[-2px]";
                                if (student.ability === 'D') colorClass = "bg-amber-100 border-amber-500 text-amber-700 shadow-[0_2px_0_0_rgba(245,158,11,1)] translate-y-[-2px]";
                                return (
                                    <button key={student.id} onClick={() => handleStudentClick(student.id)} className={`relative h-14 rounded-xl border-2 flex flex-col items-center justify-center font-bold transition-all duration-100 ${colorClass}`}>
                                        <span className="text-xl">{String(student.label || student.id)}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
                    <span className="text-xs text-slate-400 pl-2">提示：再次點擊已設定的學生可取消設定。</span>
                    <button onClick={onClose} className="px-8 py-2 bg-slate-800 text-white rounded-xl font-bold shadow-lg hover:bg-slate-700 transition-all">完成設定</button>
                </div>
              </div>
            </div>
          );
        };

        //        // === 桌子組件 ===
        const Desk = React.memo(({ student, onMouseDown, onChangeLabel, onBlurLabel, onDelete, onToggleAbility, onToggleGender, onToggleLock, isSelected, isDuplicate, showAbilityControls, isDrawn, isAssignMode, isSelectedForAssign, onSelectForAssign }) => {
          const getAbilityColor = (ability) => {
            switch(ability) {
              case 'A': return 'bg-rose-500 border-rose-600 shadow-rose-200';
              case 'B': return 'bg-blue-500 border-blue-600 shadow-blue-200';
              case 'C': return 'bg-emerald-500 border-emerald-600 shadow-emerald-200';
              case 'D': return 'bg-amber-500 border-amber-600 shadow-amber-200';
              default: return 'bg-slate-400 border-slate-500 shadow-slate-200';
            }
          };

          if (student.isEmpty) return null; 

          const getFontSizeClass = (text) => {
            const strText = String(text || '');
            const len = strText.length;
            if (len <= 2) return 'text-3xl font-black';  
            if (len === 3) return 'text-xl font-extrabold tracking-tight';  
            if (len === 4) return 'text-sm font-bold tracking-tighter'; 
            if (len === 5) return 'text-[11px] font-bold tracking-tighter';
            if (len >= 6) return 'text-[9px] font-bold tracking-tighter';
            return 'text-base font-bold';                 
          };

          const handleDeskMouseDown = (e, id) => {
              const target = e.target;
              if (target.tagName.toLowerCase() === 'input' || target.closest('button')) return;
              onMouseDown(e, id);
          };

          return (
            <div
              className={`absolute flex flex-col items-center justify-center select-none transition-transform duration-200 group ${isSelectedForAssign ? 'z-[60] scale-110' : isSelected ? 'z-50 scale-110 rotate-2 shadow-2xl' : isDrawn ? 'z-40 scale-110' : 'z-10 scale-100 hover:scale-105 hover:z-20'}`}
              style={{ left: student.x, top: student.y, width: '80px', height: '50px', transform: 'translate(-50%, -50%)', touchAction: 'none' }}
              onMouseDown={(e) => {
                  if (isAssignMode) { e.preventDefault(); onSelectForAssign(student.id); return; }
                  handleDeskMouseDown(e, student.id);
              }}
              onTouchStart={(e) => {
                  if (isAssignMode) { e.preventDefault(); onSelectForAssign(student.id); return; }
                  handleDeskMouseDown(e, student.id);
              }}
            >
              {showAbilityControls && (
                <button onClick={(e) => { e.stopPropagation(); onToggleAbility(student.id); }} className={`absolute -top-3 -left-3 w-8 h-8 rounded-full flex items-center justify-center text-sm font-black text-white shadow-md z-30 border-2 transition-transform cursor-pointer ${getAbilityColor(student.ability)} hover:scale-110`}>
                  {String(student.ability || '?')}
                </button>
              )}

              <div className={`relative w-full h-full rounded-2xl shadow-[0_4px_0_0_rgba(0,0,0,0.1)] border-2 flex items-center transition-colors ${isSelectedForAssign ? 'border-orange-500 bg-orange-100 ring-4 ring-orange-400 shadow-2xl' : isSelected ? 'border-blue-400 bg-blue-50 ring-4 ring-blue-200' : isDrawn ? 'border-yellow-400 bg-yellow-100 ring-4 ring-yellow-400 shadow-xl' : 'border-amber-300 bg-amber-100 hover:bg-amber-50'}`}>
                
                <div className={`w-4 h-full flex flex-col items-center justify-center shrink-0 rounded-l-[14px] border-r border-amber-300/30 transition-colors ${isAssignMode ? '' : 'cursor-grab active:cursor-grabbing hover:bg-amber-500/20 group/handle'}`} title={isAssignMode ? '' : "按住拖曳"}>
                    <div className={`w-1 h-1 rounded-full mb-1 ${isAssignMode ? 'bg-amber-300/50' : 'bg-amber-400/80 group-hover/handle:bg-amber-500'}`}></div>
                    <div className={`w-1 h-1 rounded-full mb-1 ${isAssignMode ? 'bg-amber-300/50' : 'bg-amber-400/80 group-hover/handle:bg-amber-500'}`}></div>
                    <div className={`w-1 h-1 rounded-full ${isAssignMode ? 'bg-amber-300/50' : 'bg-amber-400/80 group-hover/handle:bg-amber-500'}`}></div>
                </div>

                <div className="absolute top-1 right-1.5 w-1.5 h-1.5 bg-amber-300/50 rounded-full pointer-events-none"></div>
                
                <input
                  type="text"
                  readOnly={isAssignMode}
                  value={String(student.label || '')}
                  onChange={(e) => onChangeLabel(student.id, e.target.value)}
                  onBlur={() => onBlurLabel && onBlurLabel()}
                  className={`relative z-10 flex-1 w-full text-center bg-transparent border-b-2 border-dashed focus:outline-none focus:border-blue-400 p-0 leading-none mr-1 transition-colors font-sans ${getFontSizeClass(student.label)} ${isAssignMode ? 'pointer-events-none cursor-pointer' : ''} ${isDuplicate ? 'text-red-500 border-red-300 placeholder-red-200' : 'text-amber-800 border-amber-300/50 placeholder-amber-800/20'}`}
                  placeholder="#"
                />
                {!isAssignMode && (
                  <button onClick={(e) => { e.stopPropagation(); onToggleGender(student.id); }} className={`absolute -bottom-2 -left-2 rounded-full p-1 w-6 h-6 flex items-center justify-center shadow-sm z-30 transition-all border border-white ${student.gender === 'M' ? 'bg-blue-400 text-white opacity-100 scale-100' : student.gender === 'F' ? 'bg-pink-400 text-white opacity-100 scale-100' : 'bg-slate-200 text-slate-400 opacity-0 group-hover:opacity-100 scale-75 group-hover:scale-100'}`} title="設定性別">
                    <User size={12} strokeWidth={3} />
                  </button>
                )}
                {!isAssignMode && (
                  <button onClick={(e) => { e.stopPropagation(); onToggleLock(student.id); }} className={`absolute -bottom-2 -right-2 rounded-full p-1 w-6 h-6 flex items-center justify-center shadow-sm z-30 transition-all border border-white ${student.isLocked ? 'bg-red-500 text-white opacity-100 scale-100' : 'bg-slate-200 text-slate-400 opacity-0 group-hover:opacity-100 scale-75 group-hover:scale-100'}`} title={student.isLocked ? "解除固定" : "固定座位"}>
                    {student.isLocked ? <Lock size={12} strokeWidth={3} /> : <Unlock size={12} strokeWidth={3} />}
                  </button>
                )}
                {!isAssignMode && (
                  <button onClick={(e) => { e.stopPropagation(); onDelete(student.id); }} className="absolute -top-3 -right-3 bg-red-400 hover:bg-red-500 text-white rounded-full p-0.5 w-6 h-6 flex items-center justify-center shadow-sm z-30 transition-all opacity-0 group-hover:opacity-100 scale-90 group-hover:scale-110" title="刪除座位">
                    <X size={14} strokeWidth={3} />
                  </button>
                )}
              </div>
            </div>
          );
        }, (prev, next) => {
            return prev.student.x === next.student.x &&
                   prev.student.y === next.student.y &&
                   prev.student.label === next.student.label &&
                   prev.student.ability === next.student.ability &&
                   prev.student.gender === next.student.gender &&
                   prev.student.isLocked === next.student.isLocked &&
                   prev.isSelected === next.isSelected &&
                   prev.isDuplicate === next.isDuplicate &&
                   prev.showAbilityControls === next.showAbilityControls &&
                   prev.isDrawn === next.isDrawn &&
                   prev.isAssignMode === next.isAssignMode &&
                   prev.isSelectedForAssign === next.isSelectedForAssign;
        });

        //        // === 主應用程式 ===
        function ClassroomSeatingApp() {
          const [studentCount, setStudentCount] = useState(24);
          const [skipNumbersInput, setSkipNumbersInput] = useState(""); 
          const [nameList, setNameList] = useState([]); 
          const [rowsConfig, setRowsConfig] = useState(5); 
          const [pairsConfig, setPairsConfig] = useState(3); 
          const [groupSizeConfig, setGroupSizeConfig] = useState(4); 
          const [uShapeSideConfig, setUShapeSideConfig] = useState(2); 
          const [students, setStudents] = useState([]);
          const [dragState, setDragState] = useState({ isDragging: false, id: null, offset: { x: 0, y: 0 }, currentX: 0, currentY: 0 });
          const [currentMode, setCurrentMode] = useState('rows'); 
          const [drawnStudentId, setDrawnStudentId] = useState(null);
          const [isDrawing, setIsDrawing] = useState(false);

          const [isToolbarOpen, setIsToolbarOpen] = useState(true);

          const [isAssignMode, setIsAssignMode] = useState(false);
          const [selectedSeatId, setSelectedSeatId] = useState(null);

          const [toastMessage, setToastMessage] = useState(null);
          const toastTimerRef = useRef(null);

          const [history, setHistory] = useState([]);
          const [historyStep, setHistoryStep] = useState(-1);

          const [conditions, setConditions] = useState({ avoidMixedAdjacent: false, pairMixedTogether: false, restrictions: [] });
          const [isConditionModalOpen, setIsConditionModalOpen] = useState(false);

          const [isAbilityModalOpen, setIsAbilityModalOpen] = useState(false);
          const [showAbilityControls, setShowAbilityControls] = useState(true); 
          const [isNameModalOpen, setIsNameModalOpen] = useState(false); 

          const canvasRef = useRef(null);
          const fileInputRef = useRef(null);
          const [canvasSize, setCanvasSize] = useState({ width: 800, height: 600 });
          const prevCanvasWidth = useRef(800); 

          useEffect(() => {
            const updateSize = () => {
              if (canvasRef.current) {
                const newWidth = canvasRef.current.offsetWidth || 800;
                const newHeight = canvasRef.current.offsetHeight || 600;
                if (prevCanvasWidth.current !== newWidth && students.length > 0) {
                     const deltaX = (newWidth - prevCanvasWidth.current) / 2;
                     setStudents(prev => prev.map(s => ({ ...s, x: s.x + deltaX })));
                }
                setCanvasSize({ width: newWidth, height: newHeight });
                prevCanvasWidth.current = newWidth;
              }
            };
            window.addEventListener('resize', updateSize);
            updateSize();
            return () => window.removeEventListener('resize', updateSize);
          }, [students.length]); 

          const snapToGrid = (value, gridSize = 10) => Math.round(value / gridSize) * gridSize;

          const commitAction = (newStudents) => {
            if (!newStudents) return;
            if (historyStep >= 0 && history[historyStep] && JSON.stringify(history[historyStep]) === JSON.stringify(newStudents)) return;
            const nextHistory = history.slice(0, historyStep + 1);
            nextHistory.push(JSON.parse(JSON.stringify(newStudents)));
            setHistory(nextHistory);
            setHistoryStep(nextHistory.length - 1);
            setStudents(newStudents);
          };

          const handleUndo = () => {
            if (historyStep > 0) {
                const prevStep = historyStep - 1;
                setHistoryStep(prevStep);
                setStudents(JSON.parse(JSON.stringify(history[prevStep])));
            }
          };

          const handleRedo = () => {
            if (historyStep < history.length - 1) {
                const nextStep = historyStep + 1;
                setHistoryStep(nextStep);
                setStudents(JSON.parse(JSON.stringify(history[nextStep])));
            }
          };

          const canUndo = historyStep > 0;
          const canRedo = historyStep < history.length - 1;

          const handleMouseDown = (e, id) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const student = students.find(s => s.id === id);
            if (!student || !canvasRef.current) return;
            const canvasRect = canvasRef.current.getBoundingClientRect();
            const offsetX = clientX - canvasRect.left - student.x;
            const offsetY = clientY - canvasRect.top - student.y;
            setDragState({ isDragging: true, id: id, offset: { x: offsetX, y: offsetY }, currentX: student.x, currentY: student.y });
          };

          const handleMouseMove = (e) => {
            if (!dragState.isDragging || !canvasRef.current) return;
            if (e.cancelable) e.preventDefault(); 
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const canvasRect = canvasRef.current.getBoundingClientRect();
            let newX = clientX - canvasRect.left - dragState.offset.x;
            let newY = clientY - canvasRect.top - dragState.offset.y;
            newX = Math.max(40, Math.min(newX, Math.max(canvasSize.width, 600) - 40));
            newY = Math.max(25, Math.min(newY, Math.max(canvasSize.height, 400) - 25));
            setDragState(prev => ({ ...prev, currentX: newX, currentY: newY }));
          };

          const handleMouseUp = () => {
            if (dragState.isDragging && dragState.id !== null) {
              const dropX = dragState.currentX;
              const dropY = dragState.currentY;
              const draggedStudent = students.find(s => s.id === dragState.id);
              
              const targetStudent = students.find(s =>
                 s.id !== dragState.id &&
                 Math.abs(s.x - dropX) < 45 && Math.abs(s.y - dropY) < 30
              );

              let newStudents = [...students];
              if (targetStudent) {
                  newStudents = newStudents.map(s => {
                      if (s.id === dragState.id) return { ...s, x: targetStudent.x, y: targetStudent.y };
                      if (s.id === targetStudent.id) return { ...s, x: draggedStudent.x, y: draggedStudent.y };
                      return s;
                  });
                  setToastMessage(`✓ 已交換座位`);
                  if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                  toastTimerRef.current = setTimeout(() => setToastMessage(null), 3000);
              } else {
                  const finalX = snapToGrid(dropX);
                  const finalY = snapToGrid(dropY);
                  newStudents = newStudents.map(s => s.id === dragState.id ? { ...s, x: finalX, y: finalY } : s );
              }
              commitAction(newStudents); 
            }
            setDragState({ isDragging: false, id: null, offset: { x: 0, y: 0 }, currentX: 0, currentY: 0 });
          };

          const handleChangeLabel = (id, newLabel) => setStudents(prev => prev.map(s => s.id === id ? { ...s, label: String(newLabel) } : s ));
          const handleBlurLabel = () => commitAction(students);
          const handleDelete = (id) => commitAction(students.filter(s => s.id !== id));
          
          const handleToggleAbility = (id) => {
            const abilities = ['A', 'B', 'C', 'D', null];
            const newStudents = students.map(s => {
              if (s.id === id) return { ...s, ability: abilities[(abilities.indexOf(s.ability || null) + 1) % abilities.length] };
              return s;
            });
            commitAction(newStudents);
          };

          const handleToggleGender = (id) => {
            const genders = ['M', 'F', null];
            const newStudents = students.map(s => {
              if (s.id === id) return { ...s, gender: genders[(genders.indexOf(s.gender || null) + 1) % genders.length] };
              return s;
            });
            commitAction(newStudents);
          };

          const handleToggleLock = (id) => {
            const newStudents = students.map(s => {
              if (s.id === id) return { ...s, isLocked: !s.isLocked };
              return s;
            });
            commitAction(newStudents);
          };

          const openAbilityModal = () => {
            if (students.length === 0) generateSeats('rows'); 
            setIsAbilityModalOpen(true);
            setShowAbilityControls(true); 
          };

          const addOneSeat = () => {
            const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
            const centerX = snapToGrid(Math.max(canvasSize.width, 600) / 2);
            const centerY = snapToGrid(Math.max(canvasSize.height, 400) / 2);
            commitAction([...students, { id: newId, label: "", x: centerX, y: centerY, ability: null, gender: null, isLocked: false, isEmpty: false }]);
          };

          const handleClearLabels = () => commitAction(students.map(s => ({ ...s, label: "" })));

          const expectedLabels = useMemo(() => {
            if (nameList.length > 0) return nameList.map(n => String(n));
            const targetCount = Math.max(1, parseInt(studentCount) || 24);
            const skipSet = new Set(skipNumbersInput.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n)));
            let labels = [];
            let currentLabel = 1;
            let validCount = 0;
            while (validCount < targetCount) {
                if (!skipSet.has(currentLabel)) {
                    labels.push(currentLabel.toString());
                    validCount++;
                }
                currentLabel++;
            }
            return labels;
          }, [studentCount, skipNumbersInput, nameList]);

          const unassignedLabels = useMemo(() => {
            const assigned = students.map(s => String(s.label)).filter(l => l && l.trim() !== "");
            let pool = [...expectedLabels];
            assigned.forEach(a => {
                const idx = pool.indexOf(a);
                if (idx !== -1) pool.splice(idx, 1);
            });
            return pool;
          }, [students, expectedLabels]);

          const handleAssignLabel = (label) => {
              if (!selectedSeatId) return;
              const newStudents = students.map(s => s.id === selectedSeatId ? { ...s, label: String(label) } : s);
              const emptySeats = newStudents.filter(s => !s.label || String(s.label).trim() === "").sort((a, b) => a.id - b.id);
              if (emptySeats.length > 0) {
                  const nextEmpty = emptySeats.find(s => s.id > selectedSeatId) || emptySeats[0];
                  setSelectedSeatId(nextEmpty.id);
              } else {
                  setSelectedSeatId(null);
              }
              commitAction(newStudents);
          };

          const handleApplyNames = (names) => {
            setNameList(names);
            if (names.length > 0) {
                setStudentCount(names.length); 
                generateSeats(currentMode, null, names); 
            } else {
                generateSeats(currentMode, null, []); 
            }
            setIsNameModalOpen(false);
          };

          const runOptimization = (baseStudents, currentConditions, isPairsMode, strictAbility = false) => {
              if (!currentConditions.avoidMixedAdjacent && !currentConditions.pairMixedTogether && currentConditions.restrictions.length === 0) {
                  return { students: baseStudents, violations: { absolute: 0, gender: 0 } };
              }
              const N = baseStudents.length;
              const movableIndices = [];
              baseStudents.forEach((s, idx) => { if (!s.isLocked && s.label && String(s.label).trim() !== "") movableIndices.push(idx); });

              if (movableIndices.length < 2) return { students: baseStudents, violations: { absolute: 0, gender: 0 } };

              const neighbors = Array.from({ length: N }, () => []);
              for (let i = 0; i < N; i++) {
                  for (let j = i + 1; j < N; j++) {
                      const dist = Math.sqrt(Math.pow(baseStudents[i].x - baseStudents[j].x, 2) + Math.pow(baseStudents[i].y - baseStudents[j].y, 2));
                      if (dist < 160) {
                          neighbors[i].push({ idx: j, dist });
                          neighbors[j].push({ idx: i, dist });
                      }
                  }
              }

              const evaluate = (st) => {
                  let score = 0, absViolations = 0, genViolations = 0;
                  for (let i = 0; i < N; i++) {
                      if (!st[i].label) continue;
                      for (const neighbor of neighbors[i]) {
                          const j = neighbor.idx;
                          if (j < i || !st[j].label) continue;
                          const dist = neighbor.dist;
                          const isRestricted = currentConditions.restrictions.some(r => (r.a === st[i].label && r.b === st[j].label) || (r.a === st[j].label && r.b === st[i].label));
                          if (isRestricted) { score -= 1000; absViolations++; }
                          if (currentConditions.avoidMixedAdjacent && st[i].gender && st[j].gender && st[i].gender !== st[j].gender) {
                              if (!(currentConditions.pairMixedTogether && isPairsMode && dist < 100)) { score -= 10; genViolations++; }
                          }
                          if (isPairsMode && dist < 100 && currentConditions.pairMixedTogether && st[i].gender && st[j].gender && st[i].gender === st[j].gender) {
                              score -= 10; genViolations++;
                          }
                      }
                  }
                  return { score, absViolations, genViolations };
              };

              let currentState = [...baseStudents]; 
              let currentEval = evaluate(currentState);
              let bestState = [...currentState];
              let bestScore = currentEval.score;
              let bestViolations = { absolute: currentEval.absViolations, gender: currentEval.genViolations };

              if (bestScore === 0) return { students: bestState, violations: bestViolations };

              for (let i = 0; i < 1500; i++) {
                  const idx1 = movableIndices[Math.floor(Math.random() * movableIndices.length)];
                  const idx2 = movableIndices[Math.floor(Math.random() * movableIndices.length)];
                  if (idx1 === idx2 || (strictAbility && currentState[idx1].ability !== currentState[idx2].ability)) continue;

                  const nextState = [...currentState];
                  nextState[idx1] = { ...currentState[idx1], label: currentState[idx2].label, gender: currentState[idx2].gender, ability: strictAbility ? currentState[idx1].ability : currentState[idx2].ability };
                  nextState[idx2] = { ...currentState[idx2], label: currentState[idx1].label, gender: currentState[idx1].gender, ability: strictAbility ? currentState[idx2].ability : currentState[idx1].ability };

                  const nextEval = evaluate(nextState);
                  if (nextEval.score >= currentEval.score || Math.random() < Math.exp((nextEval.score - currentEval.score) / (1000 / (i + 1)))) {
                      currentState = nextState;
                      currentEval = nextEval;
                      if (currentEval.score > bestScore) {
                          bestScore = currentEval.score;
                          bestState = [...currentState]; 
                          bestViolations = { absolute: currentEval.absViolations, gender: currentEval.genViolations };
                      }
                  }
                  if (bestScore === 0) break;
              }
              return { students: bestState, violations: bestViolations };
          };

          const showOptimizationResult = (violations) => {
              if (!violations) return;
              const total = violations.absolute + violations.gender;
              setToastMessage(total === 0 ? `✓ 座位已完美符合條件！` : `盡量符合條件，仍有 ${total} 組無法避免`);
              if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
              toastTimerRef.current = setTimeout(() => setToastMessage(null), 4000);
          };

          const handleRandomDraw = () => {
            if (students.length === 0) return;
            const validStudents = students.filter(s => s.label && String(s.label).trim() !== "");
            const targetPool = validStudents.length > 0 ? validStudents : students;
            if (targetPool.length === 0) return;

            setIsDrawing(true);
            let count = 0;
            const interval = setInterval(() => {
                setDrawnStudentId(targetPool[Math.floor(Math.random() * targetPool.length)].id);
                if (++count >= 20) { clearInterval(interval); setIsDrawing(false); }
            }, 100);
          };

          const handleRandomShuffle = () => {
            if (students.length === 0) return;
            const movableIndices = [];
            students.forEach((s, idx) => { if (!s.isLocked) movableIndices.push(idx); });

            const allLabelsEmpty = movableIndices.every(idx => !students[idx].label || String(students[idx].label).trim() === "");
            let dataToShuffle = movableIndices.map(idx => ({ label: allLabelsEmpty ? String(idx + 1) : String(students[idx].label || ''), ability: students[idx].ability, gender: students[idx].gender }));
            
            for (let i = dataToShuffle.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dataToShuffle[i], dataToShuffle[j]] = [dataToShuffle[j], dataToShuffle[i]];
            }
            
            const newStudents = [...students];
            movableIndices.forEach((studentIdx, dataIdx) => {
                newStudents[studentIdx] = { ...newStudents[studentIdx], label: dataToShuffle[dataIdx].label, ability: dataToShuffle[dataIdx].ability, gender: dataToShuffle[dataIdx].gender };
            });
            
            if (conditions.avoidMixedAdjacent || conditions.pairMixedTogether || conditions.restrictions.length > 0) {
                const optimized = runOptimization(newStudents, conditions, currentMode === 'pairs', false);
                commitAction(optimized.students);
                showOptimizationResult(optimized.violations);
            } else {
                commitAction(newStudents);
            }
          };

          const handleABCDGrouping = () => {
            const targetCount = Math.max(1, parseInt(studentCount) || 24);
            const hasExistingAbilities = students.some(s => s.ability && ['A','B','C','D'].includes(s.ability));
            let baseStudents = [];

            if (hasExistingAbilities) {
                baseStudents = [...students];
            } else {
                if (nameList.length > 0) {
                     nameList.forEach((name, i) => baseStudents.push({ id: i + 1, label: String(name), isEmpty: false, ability: null, gender: null, isLocked: false }));
                } else {
                     const skipSet = new Set(skipNumbersInput.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n)));
                     let currentLabel = 1, validCount = 0;
                     while (validCount < targetCount) {
                         if (!skipSet.has(currentLabel)) {
                             baseStudents.push({ id: currentLabel, label: currentLabel.toString(), isEmpty: false, ability: null, gender: null, isLocked: false });
                             validCount++;
                         }
                         currentLabel++;
                     }
                }
                for (let i = baseStudents.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [baseStudents[i], baseStudents[j]] = [baseStudents[j], baseStudents[i]];
                }
            }

            const N = baseStudents.length;
            const desiredAbilities = new Array(N);
            const abilitiesOptions = ['A', 'B', 'C', 'D'];

            if (currentMode === 'rows') {
                const rows = parseInt(rowsConfig) || 5;
                for (let i = 0; i < N; i++) {
                    const depth = Math.floor(i / rows);
                    desiredAbilities[i] = depth === 0 ? 'A' : depth === 1 ? 'B' : depth === 2 ? 'C' : depth === 3 ? 'D' : abilitiesOptions[Math.floor(Math.random() * 4)];
                }
            } else if (currentMode === 'pairs') {
                const numPairCols = parseInt(pairsConfig) || 3;
                for (let i = 0; i < N; i++) {
                    const myDepth = Math.floor(Math.floor(i / 2) / numPairCols);
                    const posInPair = i % 2; 
                    desiredAbilities[i] = myDepth === 0 ? (posInPair === 0 ? 'A' : 'D') : myDepth === 1 ? (posInPair === 0 ? 'B' : 'C') : abilitiesOptions[Math.floor(Math.random() * 4)];
                }
            } else {
                for (let i = 0; i < N; i++) desiredAbilities[i] = ['A', 'D', 'B', 'C'][i % 4];
            }

            let studentsToGroup = [];
            if (hasExistingAbilities) {
                const abilityGroups = { 'A': [], 'B': [], 'C': [], 'D': [], '?': [] };
                const finalArranged = new Array(N).fill(null);
                baseStudents.forEach((s, idx) => {
                    if (s.isLocked && idx < N) {
                        finalArranged[idx] = s;
                        desiredAbilities[idx] = s.ability; 
                    } else {
                        abilityGroups[['A','B','C','D'].includes(s.ability) ? s.ability : '?'].push(s);
                    }
                });
                Object.values(abilityGroups).forEach(group => {
                    for (let i = group.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [group[i], group[j]] = [group[j], group[i]];
                    }
                });
                for (let i = 0; i < N; i++) {
                    if (finalArranged[i]) { studentsToGroup.push(finalArranged[i]); continue; }
                    const targetAbility = desiredAbilities[i];
                    let assignedStudent = abilityGroups[targetAbility]?.pop() || abilityGroups[['?', 'A', 'B', 'C', 'D'].find(k => abilityGroups[k]?.length > 0)]?.pop();
                    if (assignedStudent) studentsToGroup.push(assignedStudent);
                }
            } else {
                for (let i = 0; i < N; i++) { baseStudents[i].ability = desiredAbilities[i]; studentsToGroup.push(baseStudents[i]); }
            }

            setGroupSizeConfig(4); 
            generateSeats(currentMode, studentsToGroup, null, true);
          };

          const generateSeats = (mode, optionalList = null, overrideNameList = null, isFromABCD = false) => {
            setCurrentMode(mode); 
            const activeNameList = overrideNameList !== null ? overrideNameList : nameList;
            let seatList = [];

            if (optionalList) {
                seatList = optionalList;
            } else {
                const targetCount = overrideNameList !== null && overrideNameList.length > 0 ? overrideNameList.length : Math.max(1, parseInt(studentCount) || 24);
                const skipSet = new Set(skipNumbersInput.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n)));
                
                let currentLabel = 1, validCount = 0;
                while (validCount < targetCount) {
                    if (!skipSet.has(currentLabel)) {
                        let labelToUse = currentLabel.toString(), abilityToUse = null, genderToUse = null, isLockedToUse = false;
                        if (overrideNameList !== null) {
                            if (validCount < overrideNameList.length) labelToUse = String(overrideNameList[validCount]);
                        } else if (validCount < students.length) {
                            labelToUse = String(students[validCount].label || ''); abilityToUse = students[validCount].ability;
                            genderToUse = students[validCount].gender; isLockedToUse = students[validCount].isLocked;
                        } else if (activeNameList.length > validCount) {
                            labelToUse = String(activeNameList[validCount]);
                        }
                        seatList.push({ id: currentLabel, label: labelToUse, isEmpty: false, ability: abilityToUse, gender: genderToUse, isLocked: isLockedToUse, x: 0, y: 0 });
                        validCount++;
                    }
                    currentLabel++;
                }
            }

            const totalItems = seatList.length; 
            const newStudents = [];
            
            const width = Math.max(canvasSize.width || 800, 600);
            const height = Math.max(canvasSize.height || 600, 400); 
            const usableTop = 160; 
            const usableHeight = height - usableTop - 60; 

            const finalizeSeat = (index, x, y) => ({ ...seatList[index], id: index + 1, x, y });

            if (mode === 'rows') {
              const totalRows = parseInt(rowsConfig) || 5; 
              const itemsPerCol = Math.ceil(totalItems / totalRows);
              let colStep = Math.max(100, Math.round((width / (totalRows + 1)) / 20) * 20);
              let startX = (width - ((totalRows - 1) * colStep)) / 2;
              let rowStep = Math.max(60, Math.min(120, Math.round((usableHeight / itemsPerCol) / 20) * 20));
              let startY = snapToGrid(usableTop + 40); 

              for (let i = 0; i < totalItems; i++) {
                newStudents.push(finalizeSeat(i, startX + ((i % totalRows) * colStep), startY + (Math.floor(i / totalRows) * rowStep)));
              }
            } else if (mode === 'pairs') {
              const numPairCols = parseInt(pairsConfig) || 3;
              let colStep = Math.max(220, Math.round((width / (numPairCols + 1)) / 20) * 20);
              let startX = (width - ((numPairCols - 1) * colStep)) / 2;
              let rowStep = Math.max(60, Math.min(120, Math.round((usableHeight / Math.ceil((totalItems / 2) / numPairCols)) / 20) * 20));
              let startY = snapToGrid(usableTop + 40); 

              for (let i = 0; i < totalItems; i++) {
                newStudents.push(finalizeSeat(i, startX + ((Math.floor(i / 2) % numPairCols) * colStep) + ((i % 2 === 0 ? -1 : 1) * 41), startY + (Math.floor(Math.floor(i / 2) / numPairCols) * rowStep)));
              }
            } else if (mode === 'groups') {
              const sizePerGroup = parseInt(groupSizeConfig) || 4;
              const groupCenters = [];
              for (let g = 0; g < 6; g++) groupCenters.push({ x: ((width / 3) * (g % 3)) + ((width / 3) / 2), y: Math.floor(g / 3) === 0 ? usableTop + 65 : usableTop + 65 + 220 });

              const finalGroupCounts = new Array(6).fill(0), currentGroupIndices = new Array(6).fill(0);
              for (let i = 0; i < totalItems; i++) finalGroupCounts[(i < 6 * sizePerGroup ? Math.floor(i / sizePerGroup) : (i - (6 * sizePerGroup)) % 6) % 6]++;

              for (let i = 0; i < totalItems; i++) {
                const groupIndex = (i < 6 * sizePerGroup ? Math.floor(i / sizePerGroup) : (i - (6 * sizePerGroup)) % 6) % 6;
                const posInGroup = currentGroupIndices[groupIndex]++;
                const totalRows = Math.ceil(finalGroupCounts[groupIndex] / 2);
                
                let offsetX = (finalGroupCounts[groupIndex] === 5 && posInGroup === 4) ? 0 : ((posInGroup % 2 === 0 ? -1 : 1) * 45);
                let offsetY = (-((totalRows * 50 + (totalRows - 1) * 10) / 2)) + (Math.floor(posInGroup / 2) * 60) + 25;
                newStudents.push(finalizeSeat(i, groupCenters[groupIndex].x + offsetX, groupCenters[groupIndex].y + offsetY));
              }
            } else if (mode === 'u-shape') {
              const numGroups = Math.ceil(totalItems / 4), groupsForSides = Math.min(numGroups, (parseInt(uShapeSideConfig) || 2) * 2);
              const leftCount = Math.ceil(groupsForSides / 2), rightCount = Math.floor(groupsForSides / 2), backCount = numGroups - leftCount - rightCount;
              const groupCenters = []; 
              
              for (let i = 0; i < leftCount; i++) groupCenters.push({ x: 120, y: usableTop + 50 + (i * 150) });
              for (let i = 0; i < rightCount; i++) groupCenters.push({ x: width - 120, y: usableTop + 50 + (i * 150) });
              for (let i = 0; i < backCount; i++) groupCenters.push({ x: ((width - (Math.max(0, backCount - 1) * 220)) / 2) + (i * 220), y: height - 100 });

              const uShapeGroupCounts = new Array(groupCenters.length).fill(0), uShapeCurrentIndices = new Array(groupCenters.length).fill(0);
              for (let i = 0; i < totalItems; i++) uShapeGroupCounts[Math.min(Math.floor(i / 4), groupCenters.length - 1)]++;

              for (let i = 0; i < totalItems; i++) {
                  const groupIndex = Math.min(Math.floor(i / 4), groupCenters.length - 1);
                  const posInGroup = uShapeCurrentIndices[groupIndex]++;
                  const totalRows = Math.ceil(uShapeGroupCounts[groupIndex] / 2);
                  
                  let offsetX = (uShapeGroupCounts[groupIndex] === 5 && posInGroup === 4) ? 0 : ((posInGroup % 2 === 0 ? -1 : 1) * 45);
                  let offsetY = (-((totalRows * 50 + (totalRows - 1) * 10) / 2)) + (Math.floor(posInGroup / 2) * 60) + 25;
                  newStudents.push(finalizeSeat(i, groupCenters[groupIndex].x + offsetX, groupCenters[groupIndex].y + offsetY));
              }
            }

            if (conditions.avoidMixedAdjacent || conditions.pairMixedTogether || conditions.restrictions.length > 0) {
                const optimized = runOptimization(newStudents, conditions, mode === 'pairs', isFromABCD);
                commitAction(optimized.students);
                if (optionalList) showOptimizationResult(optimized.violations);
            } else {
                commitAction(newStudents);
            }

            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([JSON.stringify(students, null, 2)], { type: "application/json" }));
            link.download = `classroom_seating_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          const handleImportClick = () => {

                  fileInputRef.current.click();

          const handleFileChange = (e) => {
            const file = e.target.files[0];

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const importedData = JSON.parse(event.target.result);
                if (Array.isArray(importedData) && importedData.every(s => s.hasOwnProperty('id') && s.hasOwnProperty('x') && s.hasOwnProperty('y'))) {
                   commitAction(importedData); setStudentCount(importedData.length);

            };
            reader.readAsText(file); e.target.value = '';

          const handleExportPNG = () => {
            if (students.length === 0) return alert("目前沒有座位可供匯出");
            setToastMessage("🖼️ 處理圖片中，請稍候...");

                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setToastMessage("✓ 圖片已成功下載！");
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                    toastTimerRef.current = setTimeout(() => setToastMessage(null), 3000);

                   </div>
                   <div className="absolute top-20 left-1/2 -translate-x-1/2 w-40 h-12 bg-orange-800 rounded-xl shadow-lg flex flex-col items-center justify-center border-t-2 border-orange-600 z-0">
                      <div className="w-4/5 h-full border-x border-orange-900/30 bg-orange-700/50"></div>
                      <span className="absolute text-white text-sm font-bold tracking-widest pointer-events-none drop-shadow-md">講 台</span>
                   </div>

                   {students.length === 0 && (
                     <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center text-slate-400 pointer-events-none">
                       <div className="bg-white/50 p-6 rounded-3xl backdrop-blur-sm shadow-sm border border-white/60">
                          <Smile size={64} className="mx-auto mb-3 text-orange-300" />
                          <p className="text-xl font-bold text-slate-600">目前沒有座位</p>
                          <p className="text-sm mt-2 text-slate-500">請使用上方可愛的按鈕生成座位 ✨</p>
                       </div>
                     </div>
                   )}

                   {dragState.isDragging && !isAssignMode && (
                      <div className="absolute top-4 right-4 text-xs bg-blue-100 text-blue-600 px-3 py-1.5 rounded-full border border-blue-200 flex items-center gap-1 pointer-events-none z-50 shadow-sm font-bold">
                         <Magnet size={12} /> 自動對齊中...
                      </div>
                   )}

                   {students.map(student => {
                     const isDuplicate = student.label && labelCounts[student.label] > 1;
                     const isDragging = dragState.id === student.id;
                     const displayStudent = { ...student, x: isDragging && dragState.isDragging ? dragState.currentX : student.x, y: isDragging && dragState.isDragging ? dragState.currentY : student.y };

                     return (
                       <Desk 
                         key={student.id} student={displayStudent} onMouseDown={handleMouseDown} onChangeLabel={handleChangeLabel} onBlurLabel={handleBlurLabel}
                         onDelete={handleDelete} onToggleAbility={handleToggleAbility} onToggleGender={handleToggleGender} onToggleLock={handleToggleLock}
                         isSelected={isDragging} isDuplicate={isDuplicate} showAbilityControls={showAbilityControls}
                         isDrawn={drawnStudentId === student.id} isAssignMode={isAssignMode} isSelectedForAssign={isAssignMode && selectedSeatId === student.id} onSelectForAssign={setSelectedSeatId}
                       />
                     );
                   })}
                </div>

                {/* 提示訊息移出 canvasRef 之外，確保截圖絕對拍不到它 */}
                {toastMessage && (
                    <div className="absolute top-10 left-1/2 -translate-x-1/2 bg-emerald-600/90 backdrop-blur-md text-white px-6 py-2.5 rounded-full shadow-2xl z-[100] font-black text-sm animate-in fade-in slide-in-from-top-4 flex items-center gap-2 border-2 border-emerald-400 pointer-events-none">
                        {String(toastMessage)}
                    </div>
                )}

                {isAssignMode && (
                    <div className="w-64 lg:w-72 bg-white border-l-2 border-orange-200 shadow-2xl flex flex-col z-30 animate-in slide-in-from-right duration-300 flex-shrink-0">
                        <div className="p-3 bg-orange-100 border-b border-orange-200 flex justify-between items-center">
                            <div className="flex items-center gap-2"><Carrot className="text-orange-600" /><h3 className="font-bold text-orange-800">手動分派</h3></div>
                            <button onClick={() => setIsAssignMode(false)} className="text-orange-600 hover:bg-orange-200 p-1 rounded-full transition-colors"><X size={18} /></button>
                        </div>
                        <div className="p-4 bg-orange-50 border-b border-orange-100 text-xs text-orange-700 space-y-1.5 font-medium leading-relaxed">
                            <p className="flex items-start gap-1"><span className="bg-orange-200 text-orange-800 rounded-full w-4 h-4 flex items-center justify-center font-bold mt-0.5">1</span>點擊畫面上的<strong className="text-orange-600 px-1">指定座位</strong></p>
                            <p className="flex items-start gap-1"><span className="bg-orange-200 text-orange-800 rounded-full w-4 h-4 flex items-center justify-center font-bold mt-0.5">2</span>點選下方<strong className="text-orange-600 px-1">學生名單</strong>填入該座位</p>
                            <p className="flex items-start gap-1"><span className="bg-orange-200 text-orange-800 rounded-full w-4 h-4 flex items-center justify-center font-bold mt-0.5">3</span>系統會<strong className="text-orange-600 px-1">自動跳選</strong>下一個空位</p>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 bg-slate-50">
                            <div className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider flex justify-between items-center">
                                <span>未入座學生</span><span className="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">{unassignedLabels.length}</span>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {unassignedLabels.length === 0 ? (
                                    <div className="w-full text-center p-4 text-slate-400 text-sm font-bold bg-white rounded-xl border-2 border-dashed border-slate-200">🎉 所有學生皆已入座</div>
                                ) : (
                                    unassignedLabels.map((label, idx) => (
                                        <button key={idx} onClick={() => handleAssignLabel(label)} className="px-3 py-2 bg-white border-2 border-slate-200 rounded-lg shadow-sm hover:border-orange-400 hover:bg-orange-50 hover:text-orange-600 transition-all font-bold text-sm text-slate-600 active:scale-95 min-w-[3rem]">
                                            {String(label)}
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                )}
              </div>

              <div className="bg-white/80 backdrop-blur border-t border-orange-100 p-2 text-[10px] text-slate-500 flex justify-between items-center px-4 shrink-0">
                <span className="flex items-center gap-1 bg-orange-50 px-2 py-1 rounded-full"><Magnet size={10}/> 放開滑鼠時將自動對齊網格。</span>
                <span className="font-bold text-orange-400">© 2026 鄭念慈 版權所有</span>
            <span className="bg-blue-50 text-blue-600 px-2 py-1 rounded-full font-bold">實到人數：{actualStudentCount} (應到: {studentCount})</span>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<ClassroomSeatingApp />);
  </script>
</body>
</html>
